; —— 整图时停 (2026-09-29) ——
; 原设计: 超武 [TimeFreezeSpecialP] 是 EMPulse.TargetSelf=yes, 只能以虚空建筑
;         [TIMEFREEZELB] 自身位置为圆心引爆 (圆心 = 投放 BLYQS 的位置, 通常是自家基地),
;         作用范围 = CellSpread=225 的圆 —— 大图上基地在一角时, 对角敌人(300~400格外)会漏掉。
; 现解法: Phobos 的整图引爆, 在每个目标身上各引爆一次, 彻底摆脱半径限制。
; 限制:   仅适用于 武器弹头 / 动画武器弹头 / 暴击弹头 —— 不适用于动画弹头与
;         Ares 的 GenericWarhead 超武。本弹头是 [TimeFreezeWeaponP] 的 Warhead=, 属武器弹头 ✓
; 键名:   AffectsHouse/AffectsTarget 是 b49+ 新名 (旧名 AffectHouses/AffectTargets 仍可用但告警)
DetonateOnAllMapObjects=yes ; 在每个目标身上各引爆一次
; ⚠️ AffectsTarget 与 AffectsHouse 的默认值都是 none —— 必须显式设置, 否则整个功能空转!
