; ═══════════════════════════════════════════════════════════
; ██  弹道修复 — 低打高落点精度 (2026-09-29)
; ═══════════════════════════════════════════════════════════
; 目标: 修复 Arcing=yes 抛射体在发射地与目标存在高低差时的固定落点偏移。
;
; 键:   Arcing.AllowElevationInaccuracy=no
;         默认 true  = 保留高低差造成的精度偏差 (即问题存在)
;         设为 false = 修复
;
; ⚠️ 这是 [Projectile] 段键, 没有全局默认值 —— 必须逐个抛射体写。
;    写在 [CombatDamage] / [General] 里不生效。
;
; 历史: 2026-08-19 曾用 Phobos 的 Trajectory=Arcing 尝试修复, 当时 DLL 为
;       "Development Build #48", 报 "Expected a new trajectory type" 而失效,
;       遂判定"本构建不可用"并删除 —— 那是另一条键, 与本修复无关。
;       2026-09-21 Phobos.dll 已换新版, 本键在该 DLL 中存在 (字符串已核实)。
;
; 下方 84 个段 = rulesmo.ini 中全部 Arcing=yes 抛射体。

