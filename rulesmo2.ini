; ═══════════════════════════════════════════════════════════
; ██  [CYBO] 半机械先锋（Cyborg Vanguard）— 下放给苏军三阵营
; ═══════════════════════════════════════════════════════════
; 基座原状：无 Owner（= 任何阵营都造不了，仅战役/地图放置）、TechLevel=11、
;           Prerequisite=NAHAND,NATECHR。
; 本段改为：苏军三阵营（USSR / Latin / Chinese）均可建造，
;           建造前提 = 苏联兵营 NAHAND + 工业工厂 NAINDP。
;   · Owner  用苏军三阵营，与基座 SHK / DESO / E2 / IVAN 的写法一致（它们都不写 RequiredHouses）。
;   · TechLevel 必须 ≤10 才会出现在建造栏（11 = 永远达不到的科技等级）；
;     参照轰鸣 HMFKDDAI 的修法：TechLevel=10 + Prerequisite 里带 NAINDP。
;   · 工业工厂 = [NAINDP]（UIName=NAME:IndustrialPlant，Name=Industrial Plant，
;     Owner 含全部阵营，所以苏军三家自己都能造出来，前提可满足）。
;   · 图标/名称基座已自备（artmo.ini [CYBO] → cyboicon.pcx，ra2md.csf 有 CYBOV）。
; 还原：删掉本段（[CYBO] 第 1~3 键）即回到基座原状。
