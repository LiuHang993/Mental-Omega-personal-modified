[General]
VeteranRatio=3
VeteranROF=0.6
VeteranSight=1.2
AttackMove.Aggressive=true    ; boolean
AttackMove.UpdateTarget=true  ; boolean
EnemyInsignia=yes
BuildSpeed=.5

; ── 战机起降还原：关闭 Phobos「战机任务扩展」 ────────────────────────
; rulesmo.ini:385 设了 ExtendedAircraftMissions=yes，这是 Phobos 的战机任务/起降扩展。
; 它改写战机返场与降落动作：
;   EarlyDescend  —— 距降落点小于 SlowdownDistance 就提前下降高度（与原版不同：不再要求飞到机场正上方）
;   RearApproach  —— 从 LandingDir 的反方向长距离进场着陆
;   SmoothMoving  —— 距目的地过近时直接返场
;   FastScramble  —— 机场被摧毁时从停机位紧急起飞
;   UnlandDamage  —— 无空闲停机位时每 4 帧掉血（默认 -1 = 直接坠毁）
; 表现即战机"滑跃式"起降；机型速度越快越容易冲过停机位、反复盘旋落不下来。
; 改为 no 后恢复原版起降：飞到停机位正上方 → 停稳 → 垂直下降。
; 还原方法：删掉下面这一行（rulesmo2 与 rulesmo 逐键合并，删行即恢复 rulesmo 的 yes）。
ExtendedAircraftMissions=yes

; ── 换用「无新增单位版」基座后的布尔修正 ──────────────────────────
; 该基座把这些键写成 ture（非法布尔 → Phobos/Ares 按默认 false 处理）或整行删除，
; 本机原先已修正为 true。rulesmo2 后读优先，逐键覆盖回 true。
; 删除本块即恢复基座值。
ArtImageSwap=true
BuildingTypeSelectable=true
InfantryAutoDeploy=true
AmphibiousEnter=true
AmphibiousUnload=true
HarvesterScanAfterUnload=true
BuildingWaypoints=true            ; 攻击性建筑 Z 键路径点攻击

; ── 新增飞机必须登记进 PadAircraft，否则「机场超容量仍能点击建造」──────
; PadAircraft 是 [General] 的机场飞机名单：引擎靠它把这些机型算进停机坪容量，
; 不在名单里 = 不占停机坪 → 容量满了照样能点建造（官方 3.3.1 日志里的
; 「修复停机坪代码冲突导致新增飞机无法识别建造上限」就是这个键）。
; 无新增单位版基座删掉了威力加强版的 5 架新增飞机，所以恢复 JYMGX 后必须补回。
; ⚠️ 这是「整表覆盖」键，写了就顶掉基座整行，故必须把基座原有条目一起抄上。
; 老底座(3.3) 原值 = 本行 + ,B52F,SXWHZJ,ELSHS,WSZJ —— 日后恢复这几架时按同样方式追加。
PadAircraft=ORCA,BEAG,STORM,FORTRESS,HBIRD,FOX,BLIGHT,VENOM,DUST,LIONH,SEIZER,JYMGX

; ── 一键驻军/装车 + 建筑避让（基座 phobos.ini 写成了 ture）──────────────
; 基座 Phobos.dll 与本机为同一份（非公版 PB，功能代码在），故写 true 即可恢复；
; 若要按官方日志移除这三项功能，把下面两行删掉即可。
[GlobalControls]
AllowSwitchNoMoveCommand=true
AllowDistributionCommand=true




[AudioVisual]
Pips.Shield=1,2,4              ; pips.shp 绿黄红帧号

[IQ]
RepairSell=0

